name: Build and Deploy

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build with Maven
        run: mvn clean package -DskipTests -B
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-easy-doubao-phone
          path: target/*-jar-with-dependencies.jar

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build -t mcp-easy-doubao-phone:latest .
          docker tag mcp-easy-doubao-phone:latest ghcr.io/${{ github.repository_owner }}/mcp-easy-doubao-phone:latest
      
      - name: Save Docker image
        run: docker save mcp-easy-doubao-phone:latest | gzip > mcp-easy-doubao-phone.tar.gz
      
      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: mcp-easy-doubao-phone.tar.gz
